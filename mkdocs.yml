site_name: Minder Docs
site_description: Documentation for Minder — a local-first, self-hostable AI platform.
site_url: https://minderhq.github.io/docs/
repo_url: https://github.com/minderhq/docs
repo_name: minderhq/docs
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/brain
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/minderhq
      name: Minder on GitHub
    - icon: material/web
      link: https://minderhq.github.io/www/
      name: Website
  generator: false

copyright: Copyright &copy; 2026 Minder (minderhq)

nav:
  - Home: index.md
  - Self-hosting: self-hosting.md
  - AI setup: ai-setup.md
  - Authentication: authentication.md
  - External services: external-services.md
  - Production: production.md
  - PostgreSQL: postgresql.md
  - Using Minder: using-minder.md
  - RAG methods: rag-methods.md
  - Remote access: remote-access.md
  - Troubleshooting: troubleshooting.md
  - Monitoring: monitoring.md
  - Performance: performance.md
  - CLI: cli.md
  - Plugins:
      - Overview: plugins/index.md
      - Authoring guide: plugins/authoring.md
      - Contract reference: plugins/contract.md
      - Publishing: plugins/publishing.md
      - Manifest plugins: plugins/manifest.md
