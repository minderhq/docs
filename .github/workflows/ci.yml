name: Docs

on:
  push:
    branches: [main]
    # NOT docs/** -- that's exactly what this workflow validates/publishes.
    # Only the repo's own root files (not part of the built site) are safe to skip.
    paths-ignore: [ 'README.md', 'LICENSE' ]
  pull_request:
    branches: [main]
    paths-ignore: [ 'README.md', 'LICENSE' ]
  workflow_dispatch:

# Cancel a superseded run of THIS workflow on the same ref -- a new push to a
# PR branch, or a newer merge to main, cancels the older in-flight/queued run
# instead of piling a redundant one onto the org's constrained self-hosted pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # push (trusted, post-merge) runs on the org's self-hosted pool; pull_request
    # (including from forks -- this repo is public) stays on GitHub-hosted so an
    # external contributor's PR never executes on our infrastructure.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","Linux","X64","org-shared"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify system Python
        # Self-hosted runner (Debian 13/trixie): actions/setup-python has no
        # hosted-tool-cache build for this distro -- only python3.13 is
        # installed persistently (mirrors minderhq/minder's ci.yml fix for
        # the same gap).
        if: github.event_name == 'push'
        run: python3 --version

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip

      - name: Create isolated virtualenv
        # Self-hosted runner registrations are shared, persistent boxes -- an
        # unscoped `pip install` would mutate system-wide packages another
        # concurrent job could read mid-install, and Debian 13 also blocks a
        # bare system-wide `pip install` via PEP 668
        # (externally-managed-environment) without a venv.
        if: github.event_name == 'push'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publish main to GitHub Pages (enable Pages → "GitHub Actions" in repo settings).
    if: github.ref == 'refs/heads/main'
    needs: build
    # push (trusted, post-merge) runs on the org's self-hosted pool; pull_request
    # (including from forks -- this repo is public) stays on GitHub-hosted so an
    # external contributor's PR never executes on our infrastructure.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","Linux","X64","org-shared"]') || 'ubuntu-latest' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
