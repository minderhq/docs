name: Docs

on:
  push:
    branches: [main]
    # NOT docs/** -- that's exactly what this workflow validates/publishes.
    # Only the repo's own root files (not part of the built site) are safe to skip.
    paths-ignore: [ 'README.md', 'LICENSE' ]
  pull_request:
    branches: [main]
    paths-ignore: [ 'README.md', 'LICENSE' ]
  workflow_dispatch:

# Cancel a superseded run of THIS workflow on the same ref -- a new push to a
# PR branch, or a newer merge to main, cancels the older in-flight/queued run
# instead of piling a redundant one onto the org's constrained self-hosted pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Always GitHub-hosted: this public repo's self-hosted push CI queued behind
    # the org runner group's allows_public_repositories=false gate and never ran.
    # Hosted is free for public repos; fork PRs already ran hosted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify system Python
        # Self-hosted runner (Debian 13/trixie): actions/setup-python has no
        # hosted-tool-cache build for this distro -- only python3.13 is
        # installed persistently (mirrors minderhq/minder's ci.yml fix for
        # the same gap).
        if: github.event_name == 'push'
        run: python3 --version

      - name: Set up uv
        # SHA-pinned (org convention since the TruffleHog CVE-2026-33634
        # incident). Pull requests pin 3.12 via UV_PYTHON (uv fetches a managed
        # build); push passes none, so uv uses the runner's python3.
        # activate-environment creates a venv (outside the checkout, so it never
        # ends up in the built site) and puts it on PATH for later steps --
        # `uv pip install` needs a venv rather than the system interpreter.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ github.event_name != 'push' && '3.12' || '' }}
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - run: uv pip install -r requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Publish main to GitHub Pages (enable Pages → "GitHub Actions" in repo settings).
    if: github.ref == 'refs/heads/main'
    needs: build
    # Always GitHub-hosted: this job only runs actions/deploy-pages (no build,
    # no repo code executes), and that action's OIDC id-token fetch can time out
    # on the self-hosted pool ("Failed to get ID Token"), which fails the Pages
    # deploy. GitHub-hosted has reliable OIDC and costs no self-hosted time.
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
